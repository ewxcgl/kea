#:schema node_modules/wrangler/config-schema.json
name = "kea-relay"
main = "src/index.ts"

# Pinned to a date every wrangler 3.x release accepts. A date newer than the
# installed wrangler supports is rejected outright, and the version floats, so
# this stays conservative on purpose.
compatibility_date = "2024-11-20"

# Deploy to the workers.dev subdomain.
#
# NOTE: this MUST sit above any [table] header. In TOML a key belongs to the
# table above it, so putting this under [observability] silently makes it an
# "unexpected field" and the subdomain setting is ignored.
#
# A brand-new Cloudflare account has no workers.dev subdomain yet. Opening the
# Workers landing page in the dashboard once creates it; without that, deploy
# fails with API error 10063.
workers_dev = true

# Durable Objects power the WebSocket relay. One object per group.
#
# SQLite is the backing store; the relay keeps only a tiny roster record per
# group, so this is far more than it needs.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[observability]
enabled = true

# ---------------------------------------------------------------------------
# Deploy with:  npx wrangler deploy      (or let GitHub Actions do it)
#
# No payment method is required on the Workers free plan.
#
# Then in the app, Settings -> Relay server, enter ONLY the host:
#     wss://kea-relay.<your-subdomain>.workers.dev
#
# The client builds the rest of the endpoint itself: it appends
# /ws/<base64url groupId>, so the group id never has to be configured by hand.
#
# The group id travels in the path rather than the query string so the 16-byte
# key never lands in a query log. relay.py accepts the same shape and ignores
# the extra segment, so one URL works against either backend.
# ---------------------------------------------------------------------------