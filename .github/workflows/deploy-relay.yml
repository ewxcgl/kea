name: Deploy KEA relay

# The relay runs on Cloudflare Workers. This deploys it on push to main,
# which means you never need wrangler installed locally - and you cannot,
# because Cloudflare's local runtime (workerd) has no Windows-on-ARM build.
#
# If the deploy fails, the diagnostics are committed to the `deploy-log` branch
# so the failure can be read without needing access to the CI log viewer.

on:
  push:
    branches: [main]
    paths:
      - "relay-wrangler/**"
      - ".github/workflows/deploy-relay.yml"
  workflow_dispatch: {}

concurrency:
  # Never let two deploys race; a newer commit should win.
  group: deploy-relay
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # `contents: write` so the diagnostics step can push the deploy-log branch.
    # This is a job-level key; `permissions` is NOT valid inside a step, which
    # GitHub rejects at parse time (zero jobs, immediate failure).
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Needed later to publish the deploy-log branch.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Cloudflare credentials are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            exit 1
          fi
          echo "Both secrets present."

      - name: Install dependencies
        working-directory: relay-wrangler
        # `npm install`, not `npm ci`: no lockfile is committed, because a
        # correct one cannot be generated on the Windows-on-ARM machine that
        # maintains this repo (wrangler's `workerd` has no win-arm64 build, so
        # the dependency tree cannot be resolved there to verify it). CI
        # resolves from the registry on x64 Linux.
        run: npm install --no-fund --no-audit

      - name: Report toolchain
        working-directory: relay-wrangler
        run: |
          {
            echo "node $(node --version)"
            echo "npm $(npm --version)"
            echo "wrangler $(npx wrangler --version 2>&1 | tail -1)"
          } | tee "$RUNNER_TEMP/toolchain.txt"

      - name: Typecheck before deploying
        # Catch a broken Durable Object before it reaches production.
        working-directory: relay-wrangler
        run: npm run typecheck

      - name: Verify the Python relay still conforms
        # The TypeScript relay and the Python reference are two implementations
        # of one wire protocol. If the protocol drifts, every client breaks -
        # so this gate runs before every deploy.
        working-directory: relay
        run: |
          python -m pip install --quiet -r requirements.txt -r requirements-dev.txt
          python test_protocol.py

      # --- who am I? -------------------------------------------------------
      # `wrangler whoami` is the single most useful diagnostic: it reports which
      # token authenticated, as which account, and which permissions it has.
      # Almost every deploy failure is explained by its output.
      - name: Identify Cloudflare account
        id: whoami
        continue-on-error: true
        working-directory: relay-wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler whoami 2>&1 | tee "$RUNNER_TEMP/whoami.txt"
          exit 0

      # --- workers.dev subdomain -------------------------------------------
      # A brand-new Cloudflare account has no workers.dev subdomain, and
      # `wrangler deploy` refuses to run without one (API error 10063).
      # Simply loading the Workers landing page used to create it implicitly;
      # on the current dashboard it does not, so create it explicitly here.
      #
      # GET /accounts/{id}/workers/subdomain  -> is there one already?
      # PUT /accounts/{id}/workers/subdomain  -> create  {"subdomain": "..."}
      - name: Ensure a workers.dev subdomain exists
        id: subdomain
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          API="https://api.cloudflare.com/client/v4"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          echo "Checking for an existing workers.dev subdomain..."
          curl -s -H "$AUTH" \
            "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | tee "$RUNNER_TEMP/subdomain.json"

          name=$(python3 -c "
          import json,sys
          try:
              print(json.load(sys.stdin).get('result') or '')
          except Exception:
              print('')
          " < "$RUNNER_TEMP/subdomain.json")

          if [ -n "$name" ]; then
            echo "Already provisioned: $name"
            echo "name=$name" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "No subdomain yet. Creating one..."
          # Derive the candidate from the account id so it is globally unique
          # and therefore unlikely to already be taken by someone else.
          short=$(echo "$CLOUDFLARE_ACCOUNT_ID" | cut -c1-10)
          : > "$RUNNER_TEMP/subdomain-create.json"
          for candidate in "kea-$short" "kea-relay-$short" "kea-$short-relay"; do
            echo "Trying: $candidate"
            curl -s -X PUT -H "$AUTH" -H "Content-Type: application/json" \
              -d "{\"subdomain\":\"$candidate\"}" \
              "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
              | tee -a "$RUNNER_TEMP/subdomain-create.json"
            echo
            if python3 -c "
          import json,sys
          try:
              sys.exit(0 if json.load(sys.stdin).get('success') else 1)
          except Exception:
              sys.exit(1)
          " < "$RUNNER_TEMP/subdomain-create.json"; then
              echo "Subdomain created: $candidate"
              echo "name=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "::warning::Could not create a workers.dev subdomain automatically."
          echo "name=" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Deploy
        id: deploy
        continue-on-error: true
        working-directory: relay-wrangler
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publish diagnostics
        # Commits whatever we captured to an orphan branch, so a failure is
        # readable without CI log access. Never touches main.
        if: always() && steps.deploy.outcome == 'failure'
        working-directory: relay-wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          OUT="$RUNNER_TEMP/diagnostics.txt"
          {
            echo "# KEA relay deploy diagnostics"
            echo
            echo "commit : ${{ github.sha }}"
            echo "when   : $(date -u +%FT%TZ)"
            echo
            echo "## toolchain"
            cat "$RUNNER_TEMP/toolchain.txt" 2>/dev/null
            echo
            echo "## wrangler whoami"
            cat "$RUNNER_TEMP/whoami.txt" 2>/dev/null
            echo
            echo "## workers.dev subdomain"
            cat "$RUNNER_TEMP/subdomain.json" 2>/dev/null
            echo
            cat "$RUNNER_TEMP/subdomain-create.json" 2>/dev/null
            echo
            echo "## wrangler deploy --dry-run"
            npx wrangler deploy --dry-run 2>&1
            echo
            echo "## wrangler deploy (full output)"
            npx wrangler deploy 2>&1
          } > "$OUT" 2>&1

          # Redact the token if it ever appears in output.
          sed -i "s/${CLOUDFLARE_API_TOKEN}/***REDACTED***/g" "$OUT"

          git checkout --orphan deploy-log
          git reset --hard
          mkdir -p diag
          cp "$OUT" "diag/$(date -u +%Y%m%dT%H%M%SZ).txt"
          cp "$OUT" diag/latest.txt
          git add diag
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "deploy diagnostics $(date -u +%FT%TZ)"
          git push -f origin deploy-log
          echo "Diagnostics published to the deploy-log branch."

      - name: Show the endpoint
        if: steps.deploy.outcome == 'success'
        run: |
          sub="${{ steps.subdomain.outputs.name }}"
          echo ""
          echo "=========================================================="
          echo " Relay deployed."
          echo ""
          echo " In KEA -> Settings -> Relay server, enter ONLY the host:"
          echo "     wss://kea-relay.$sub.workers.dev"
          echo ""
          echo " The client appends /ws/<groupId> itself."
          echo "=========================================================="

      - name: Fail if the deploy did not succeed
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "::error::wrangler deploy failed; see the deploy-log branch for diagnostics"
          exit 1