name: Deploy KEA relay

# The relay runs on Cloudflare Workers. This deploys it on push to main,
# which means you never need wrangler installed locally - and you cannot,
# because Cloudflare's local runtime (workerd) has no Windows-on-ARM build.

on:
  push:
    branches: [main]
    paths:
      - "relay-wrangler/**"
      - ".github/workflows/deploy-relay.yml"
  workflow_dispatch: {}

concurrency:
  # Never let two deploys race; a newer commit should win.
  group: deploy-relay
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: relay-wrangler
        run: npm ci --no-fund --no-audit

      - name: Typecheck before deploying
        # Catch a broken Durable Object before it reaches production.
        working-directory: relay-wrangler
        run: npm run typecheck

      - name: Verify the Python relay still conforms
        # The TypeScript relay and the Python reference are two implementations
        # of one wire protocol. If the protocol drifts, every client breaks -
        # so this gate runs before every deploy.
        working-directory: relay
        run: |
          python -m pip install --quiet -r requirements.txt -r requirements-dev.txt
          python test_protocol.py

      - name: Deploy
        working-directory: relay-wrangler
        run: npx wrangler deploy
        env:
          # Repo secret: Settings -> Secrets and variables -> Actions
          #   CLOUDFLARE_API_TOKEN  (from Cloudflare dashboard -> My Profile ->
          #                          API Tokens -> Create Token ->
          #                          "Edit Cloudflare Workers" template)
          #   CLOUDFLARE_ACCOUNT_ID (right side of the dashboard)
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Show the endpoint
        run: |
          echo "Add this host to KEA - Settings - Relay server:"
          echo "  wss://kea-relay.<your-subdomain>.workers.dev"
          echo "The client appends /ws/<groupId> itself."