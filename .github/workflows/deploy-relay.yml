name: Deploy KEA relay

# The relay runs on Cloudflare Workers.
#
# This never needs wrangler locally, which matters because Cloudflare's local
# runtime (workerd) has no Windows-on-ARM build, so wrangler cannot be
# installed on the machine that maintains this repo at all.
#
# Whatever happens, the outcome is written to the `deploy-log` branch so it can
# be read without access to the CI log viewer.

on:
  push:
    branches: [main]
    paths:
      - "relay-wrangler/**"
      - ".github/workflows/deploy-relay.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-relay
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Job-level only: `permissions` is not valid inside a step, and GitHub
    # rejects the entire workflow file at parse time if it appears there.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Cloudflare credentials are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            exit 1
          fi
          echo "Both secrets present."

      - name: Install dependencies
        working-directory: relay-wrangler
        # `npm install`, not `npm ci`: no lockfile is committed, because a
        # correct one cannot be generated on the Windows-on-ARM machine that
        # maintains this repo (workerd has no win-arm64 build, so the tree
        # cannot be resolved there to verify it).
        run: npm install --no-fund --no-audit

      - name: Report toolchain
        working-directory: relay-wrangler
        run: |
          {
            echo "node $(node --version)"
            echo "npm $(npm --version)"
            echo "wrangler $(npx wrangler --version 2>&1 | tail -1)"
          } | tee "$RUNNER_TEMP/toolchain.txt"

      - name: Typecheck before deploying
        working-directory: relay-wrangler
        run: npm run typecheck

      - name: Verify the Python relay still conforms
        # Two implementations of one wire protocol. If they drift, every client
        # breaks - so this gate runs before every deploy.
        working-directory: relay
        run: |
          python -m pip install --quiet -r requirements.txt -r requirements-dev.txt
          python test_protocol.py

      - name: Identify Cloudflare account
        continue-on-error: true
        working-directory: relay-wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler whoami 2>&1 | tee "$RUNNER_TEMP/whoami.txt" || true

      # --- workers.dev subdomain ------------------------------------------
      # Without one, `wrangler deploy` refuses to make the script routable
      # (API error 10063). Older Cloudflare dashboards created it implicitly
      # just by loading the Workers page; the current one does not, so create
      # it through the API instead.
      #
      #   GET /accounts/{id}/workers/subdomain  -> does one exist?
      #   PUT /accounts/{id}/workers/subdomain  -> create {"subdomain": "..."}
      # Permission required: Workers Scripts Write.
      - name: Provision the workers.dev subdomain
        id: subdomain
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          API="https://api.cloudflare.com/client/v4"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          BASE="$API/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          REPORT="$RUNNER_TEMP/subdomain.txt"
          : > "$REPORT"

          existing=$(curl -s -H "$AUTH" "$BASE")
          echo "GET  -> $existing" | tee -a "$REPORT"
          name=$(printf '%s' "$existing" | python3 -c "
          import json,sys
          try: print(json.load(sys.stdin).get('result') or '')
          except Exception: print('')
          ")

          if [ -n "$name" ]; then
            echo "Already provisioned: $name"
            echo "name=$name" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Derive candidates from the account id: globally unique, so unlikely
          # to already be taken.
          short=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | cut -c1-10)
          for candidate in "kea-$short" "kea-relay-$short" "kea-$short-relay"; do
            resp=$(curl -s -X PUT -H "$AUTH" -H "Content-Type: application/json" \
              -d "{\"subdomain\":\"$candidate\"}" "$BASE")
            echo "PUT $candidate -> $resp" | tee -a "$REPORT"
            if printf '%s' "$resp" | python3 -c "
          import json,sys
          try: sys.exit(0 if json.load(sys.stdin).get('success') else 1)
          except Exception: sys.exit(1)
          "; then
              echo "Created: $candidate"
              echo "name=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          # Do NOT claim success here. Report nothing and let the diagnostics
          # step show why; an earlier version exited 0 unconditionally, which
          # made a total failure look green.
          echo "Could not provision a subdomain."
          echo "name=" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Deploy
        id: deploy
        continue-on-error: true
        working-directory: relay-wrangler
        run: |
          set +e
          npx wrangler deploy > "$RUNNER_TEMP/deploy.log" 2>&1
          code=$?
          cat "$RUNNER_TEMP/deploy.log"
          exit $code
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publish diagnostics
        # Always, and never fatal: this step exists to make the outcome
        # readable, so failing here would hide the information it collects.
        if: always()
        continue-on-error: true
        run: |
          set +e
          OUT="$RUNNER_TEMP/diagnostics.txt"
          {
            echo "# KEA relay deploy diagnostics"
            echo
            echo "commit    : ${{ github.sha }}"
            echo "when      : $(date -u +%FT%TZ)"
            echo "deploy    : ${{ steps.deploy.outcome }}"
            echo "subdomain : ${{ steps.subdomain.outputs.name }}"
            echo
            echo "## subdomain provisioning"
            cat "$RUNNER_TEMP/subdomain.txt" 2>/dev/null
            echo
            echo "## workers.dev subdomain (authoritative, after deploy)"
            curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
              2>/dev/null
            echo
            echo "## deploy stdout"
            cat "$RUNNER_TEMP/deploy.log" 2>/dev/null
            echo
            echo "## toolchain"
            cat "$RUNNER_TEMP/toolchain.txt" 2>/dev/null
            echo
            echo "## wrangler whoami"
            cat "$RUNNER_TEMP/whoami.txt" 2>/dev/null
          } > "$OUT" 2>&1

          # Never let the token reach a committed file.
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            sed -i "s|${CLOUDFLARE_API_TOKEN}|***REDACTED***|g" "$OUT" 2>/dev/null
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf .git/refs/heads/deploy-log 2>/dev/null
          git checkout --orphan deploy-log 2>/dev/null || git checkout -B deploy-log
          git reset --hard 2>/dev/null
          mkdir -p diag
          cp "$OUT" "diag/$(date -u +%Y%m%dT%H%M%SZ).txt" 2>/dev/null
          cp "$OUT" diag/latest.txt 2>/dev/null
          git add diag 2>/dev/null
          git commit -q -m "deploy diagnostics $(date -u +%FT%TZ)" 2>/dev/null
          git push -f origin deploy-log 2>/dev/null
          echo "Diagnostics published to the deploy-log branch."
          exit 0
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Summarise
        if: always()
        run: |
          sub="${{ steps.subdomain.outputs.name }}"
          echo ""
          if [ "${{ steps.deploy.outcome }}" = "success" ] && [ -n "$sub" ]; then
            echo "Relay deployed."
            echo ""
            echo "  KEA -> Settings -> Relay server, enter ONLY the host:"
            echo "    wss://kea-relay.$sub.workers.dev"
            echo ""
            echo "The client appends /ws/<groupId> itself."
          else
            echo "Deploy outcome : ${{ steps.deploy.outcome }}"
            echo "Subdomain      : ${sub:-<none>}"
            echo ""
            echo "Read the full picture on the deploy-log branch:"
            echo "  https://github.com/ewxcgl/kea/blob/deploy-log/diag/latest.txt"
            if [ -z "$sub" ]; then
              echo ""
              echo "NO SUBDOMAIN was provisioned, so the script is not routable"
              echo "even though the upload succeeded. See '## subdomain"
              echo "provisioning' above for the API's reason."
            fi
          fi
          exit 0