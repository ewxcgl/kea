name: Deploy KEA relay

# The relay runs on Cloudflare Workers. This deploys it on push to main,
# which means you never need wrangler installed locally - and you cannot,
# because Cloudflare's local runtime (workerd) has no Windows-on-ARM build.

on:
  push:
    branches: [main]
    paths:
      - "relay-wrangler/**"
      - ".github/workflows/deploy-relay.yml"
  workflow_dispatch: {}

concurrency:
  # Never let two deploys race; a newer commit should win.
  group: deploy-relay
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Fail early, and say exactly which secret is missing, rather than letting
      # wrangler die with a generic auth error five steps later.
      - name: Check Cloudflare credentials are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo ""
            echo "Add them at:"
            echo "  https://github.com/ewxcgl/kea/settings/secrets/actions"
            echo ""
            echo "  CLOUDFLARE_API_TOKEN  - Cloudflare dashboard -> My Profile ->"
            echo "                          API Tokens -> Create Token ->"
            echo "                          'Edit Cloudflare Workers' template"
            echo "  CLOUDFLARE_ACCOUNT_ID - the 32-character hex id on the right"
            echo "                          side of the Cloudflare dashboard"
            exit 1
          fi
          echo "Both secrets present."

      - name: Install dependencies
        working-directory: relay-wrangler
        # `npm install`, not `npm ci`: no lockfile is committed, because a
        # correct one cannot be generated on the Windows-on-ARM machine that
        # maintains this repo (wrangler's `workerd` has no win-arm64 build, so
        # the dependency tree cannot be resolved there to verify it). CI
        # resolves from the registry on x64 Linux.
        run: npm install --no-fund --no-audit

      - name: Report toolchain
        working-directory: relay-wrangler
        run: |
          echo "node $(node --version)"
          echo "wrangler $(npx wrangler --version 2>&1 | tail -1)"

      - name: Typecheck before deploying
        # Catch a broken Durable Object before it reaches production.
        working-directory: relay-wrangler
        run: npm run typecheck

      - name: Verify the Python relay still conforms
        # The TypeScript relay and the Python reference are two implementations
        # of one wire protocol. If the protocol drifts, every client breaks -
        # so this gate runs before every deploy.
        working-directory: relay
        run: |
          python -m pip install --quiet -r requirements.txt -r requirements-dev.txt
          python test_protocol.py

      - name: Deploy
        working-directory: relay-wrangler
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Show the endpoint
        run: |
          echo "Add this host to KEA - Settings - Relay server:"
          echo "  wss://kea-relay.<your-subdomain>.workers.dev"
          echo "The client appends /ws/<groupId> itself."